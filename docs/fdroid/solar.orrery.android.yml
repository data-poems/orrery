# A copy of the recipe on the branch solar.orrery.android of lukeslp/fdroiddata (commit 5e54d8b7, November 24,
# 2026), for reference. F-Droid reads the copy in fdroiddata, not this one; after a request is merged there, their
# update bot rewrites it, so expect this file to fall behind.
Categories:
  - Science & Education
License: MIT
AuthorName: Luke Steuber
AuthorWebSite: https://lukesteuber.com/
WebSite: https://orrery.solar/
SourceCode: https://github.com/data-poems/orrery
IssueTracker: https://github.com/data-poems/orrery/issues
Changelog: https://github.com/data-poems/orrery/blob/HEAD/CHANGELOG.md

AutoName: Solar Orrery

RepoType: git
Repo: https://github.com/data-poems/orrery.git
Binaries: 
  https://github.com/data-poems/orrery/releases/download/v%v/solar-orrery-%v-%c.apk

Builds:
  - versionName: 1.3.0
    versionCode: 786
    commit: 36d86e6f74c563b6b3725636177e6fea5f956439
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
      - npm install -g pnpm@12.9.1
    init:
      - cd ../..
      - pnpm install --frozen-lockfile
      - SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) pnpm build:android
      - pnpm exec cap sync android
    gradle:
      - yes
    scandelete:
      - node_modules

AllowedAPKSigningKeys: 52320cb3df703842ea9a349cba6825349a04cbf7d6b33181b12be544d0fc772e

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: ios/App/App.xcodeproj/project.pbxproj|CURRENT_PROJECT_VERSION = (\d+);|package.json|"version":\s*"([\d.]+)"
CurrentVersion: 1.3.0
CurrentVersionCode: 786
