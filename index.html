<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Orrery</title>
    <meta name="description" content="From Earth to the Oort Cloud. Interactive, 41,000 stars, 88 constellations, real data, mostly live. Fake scales." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Orrery" />
    <meta property="og:description" content="From Earth to the Oort Cloud. Interactive, 41,000 stars, 88 constellations, real data, mostly live. Fake scales." />
    <meta property="og:image" content="https://orrery.solar/orrery/og-image.png" />
    <meta property="og:url" content="https://orrery.solar" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orrery" />
    <meta name="twitter:description" content="From Earth to the Oort Cloud. Interactive, 41,000 stars, 88 constellations, real data, mostly live. Fake scales." />
    <meta name="twitter:image" content="https://orrery.solar/orrery/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Cormorant:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Preload critical-path catalogs so fetch starts during HTML parse, not after JS loads -->
    <link rel="preload" as="fetch" type="application/json" crossorigin href="%BASE_URL%data/stars.hyg-8.json">
    <link rel="preload" as="fetch" type="application/json" crossorigin href="%BASE_URL%data/constellations.json">
    <link rel="preload" as="fetch" type="application/json" crossorigin href="%BASE_URL%data/constellations.lines.json">

    <!-- Theme bootstrap: set accent vars before React mounts to avoid first-paint flicker -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('orrery-theme');
          var THEMES = {
            brass: ['#00ffcc', '0,255,204', 'rgba(255,255,255,0.08)'],
            silver: ['#66bbff', '102,187,255', 'rgba(255,255,255,0.08)'],
            highcontrast: ['#ffff00', '255,255,0', 'rgba(255,255,255,0.15)'],
            ember: ['#44ccaa', '68,204,170', 'rgba(255,255,255,0.08)']
          };
          var c = THEMES[t] || THEMES.brass;
          var r = document.documentElement;
          r.style.setProperty('--accent', c[0]);
          r.style.setProperty('--accent-rgb', c[1]);
          r.style.setProperty('--panel-border', c[2]);
        } catch (e) { /* SSR or private browsing */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
