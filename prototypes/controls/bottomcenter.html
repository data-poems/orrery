<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>orrery controls · bottom bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #86b8ff; --accent-rgb: 134, 184, 255;
    --ink: #eaf0ff;
    --glass: rgba(255,255,255,0.05); --glass-hi: rgba(255,255,255,0.12);
    --stroke: rgba(255,255,255,0.16);
    --chip: 46px;
    --ease: cubic-bezier(0.34, 1.56, 0.64, 1); /* spring-like overshoot */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 70% 25%, rgba(20,28,60,0.45), transparent 60%),
      radial-gradient(ellipse at 25% 85%, rgba(40,20,55,0.35), transparent 55%),
      #04050c;
    color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden; height: 100dvh;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
      radial-gradient(1px 1px at 80% 60%, #fff6, transparent),
      radial-gradient(1px 1px at 50% 80%, #fff5, transparent),
      radial-gradient(1px 1px at 65% 15%, #fff7, transparent),
      radial-gradient(1px 1px at 35% 55%, #fff5, transparent);
  }
  .caption { position: fixed; top: 28px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.5); font-size: 15px; letter-spacing: 3px;
    text-transform: uppercase; font-weight: 300; }
  .hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.32); font-size: 14px; font-style: italic;
    padding-bottom: env(safe-area-inset-bottom); }

  /* ─── bottom-center bloom stage ───────────────────────────── */
  .stage {
    position: fixed; left: 50%; bottom: calc(54px + env(safe-area-inset-bottom));
    width: 0; height: 0;
  }
  /* the hub anchor sits at the stage origin; the arc fans upward */
  .hub {
    position: absolute; left: 0; top: 0;
    width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #ffe9b8, #f0a338 60%, #c8761b);
    box-shadow: 0 0 22px rgba(240,163,56,0.5), 0 0 52px rgba(240,163,56,0.22);
    border: none; cursor: pointer; z-index: 6; overflow: hidden;
    color: rgba(8,6,2,0.78); font-family: inherit;
    animation: pulse 6s ease-in-out infinite;
    transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease);
  }
  @keyframes pulse { 50% { box-shadow: 0 0 30px rgba(240,163,56,0.7), 0 0 78px rgba(240,163,56,0.32); } }
  .hub.flash { box-shadow: 0 0 48px rgba(255,220,150,0.95), 0 0 130px rgba(240,163,56,0.55); transform: scale(1.16); }
  .hub.remote-focus { outline: 2px solid var(--accent); outline-offset: 6px; }
  /* breadcrumb label shown when the hub is acting as Back */
  .hub .crumb {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px; line-height: 1;
  }
  .hub.back .crumb { display: flex; }
  .hub .crumb .arrow { font-size: 17px; }
  .hub .crumb .who { font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* a control node blooms from the hub origin into its arc slot */
  .node {
    position: absolute; left: 0; top: 0;
    width: var(--chip); height: var(--chip); margin: calc(var(--chip)/-2);
    transform: translate(0, 0) scale(0); opacity: 0;
    transition: transform 0.55s var(--ease), opacity 0.34s ease;
    transition-delay: var(--delay, 0s);
    pointer-events: none;
  }
  .node.shown {
    transform: translate(var(--x), var(--y)) scale(1); opacity: 1;
    pointer-events: auto;
  }
  /* crossfade: outgoing tier fades in place without flying home */
  .node.fading {
    transform: translate(var(--x), var(--y)) scale(0.84); opacity: 0;
    pointer-events: none; transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .node .ico {
    width: 100%; height: 100%; border-radius: 50%; position: relative;
    display: grid; place-items: center; cursor: pointer;
    background: var(--glass); border: 1px solid var(--stroke); color: var(--ink);
    backdrop-filter: blur(12px) saturate(1.4); -webkit-backdrop-filter: blur(12px) saturate(1.4);
    transition: background 0.25s, border-color 0.25s, box-shadow 0.4s, transform 0.25s var(--ease);
  }
  .node .ico:hover { background: var(--glass-hi); border-color: rgba(var(--accent-rgb),0.55); transform: scale(1.12); }
  .node svg { width: 21px; height: 21px; }
  .node.has-sub .ico::after {
    content: ''; position: absolute; right: -2px; bottom: -2px;
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(var(--accent-rgb),0.7); box-shadow: 0 0 6px rgba(var(--accent-rgb),0.6);
  }

  /* Apple-TV style accent focus ring */
  .node.remote-focus .ico {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.55), 0 0 22px rgba(var(--accent-rgb),0.5);
    transform: scale(1.16);
  }

  .node .lbl {
    position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
    color: rgba(255,255,255,0.55); white-space: nowrap; opacity: 0; transition: opacity 0.2s;
  }
  .node .ico:hover ~ .lbl, .node.remote-focus .lbl { opacity: 1; }

  /* sub tier = the label rides inside the chip glyph slot, compact */
  .node.sub .lbl { font-size: 9px; bottom: calc(100% + 4px); }

  /* sky control lit */
  .ico.lit { background: rgba(var(--accent-rgb),0.26); border-color: rgba(var(--accent-rgb),0.75);
    box-shadow: 0 0 14px rgba(var(--accent-rgb),0.55), 0 0 32px rgba(var(--accent-rgb),0.3); }
  .ico.lit svg { color: var(--accent); filter: drop-shadow(0 0 4px rgba(var(--accent-rgb),0.9)); }
  .sky-lines { stroke-dasharray: 60; stroke-dashoffset: 60; transition: stroke-dashoffset 0.7s var(--ease); }
  .ico.lit .sky-lines { stroke-dashoffset: 0; }

  .shimmer { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 1;
    background: linear-gradient(115deg, transparent 35%, rgba(var(--accent-rgb),0.16) 50%, transparent 65%);
    background-size: 250% 100%; }
  .shimmer.run { animation: sweep 1.1s var(--ease) forwards; }
  @keyframes sweep { 0% { opacity:0; background-position:120% 0; } 25% { opacity:1; } 100% { opacity:0; background-position:-40% 0; } }

  @media (prefers-reduced-motion: reduce) {
    .hub { animation: none !important; }
    .node, .hub { transition: none !important; }
    .sky-lines { transition: none; }
    .shimmer.run { animation: none; }
  }
</style>
</head>
<body>
  <div class="caption">Bottom bloom</div>
  <div class="shimmer" id="shimmer"></div>

  <div class="stage" id="stage">
    <button class="hub" id="hub" aria-label="Bloom or collapse the controls" aria-expanded="false">
      <span class="crumb"><span class="arrow">‹</span><span class="who" id="crumbWho"></span></span>
    </button>
  </div>

  <div class="hint">Tap to open · arrows move · back steps out</div>

<script>
  const ICONS = {
    tour: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>',
    dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor" stroke="none"/></svg>',
    sky: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline class="sky-lines" points="4,15 9,7 14,13 20,5"/><circle cx="4" cy="15" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="7" r="1.4" fill="currentColor" stroke="none"/><circle cx="14" cy="13" r="1.4" fill="currentColor" stroke="none"/><circle cx="20" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg>',
    scale: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>',
    info: '<span style="font-size:18px;font-style:italic;">i</span>',
    layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="5" y1="8" x2="19" y2="8"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="5" y1="16" x2="19" y2="16"/></svg>',
    dot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="6"/></svg>',
  };

  // primary controls (level 1) — Tour/Dice are direct; the rest carry subs
  const PRIMARY = [
    { k: 'tour',   label: 'Tour' },
    { k: 'scale',  label: 'Scale',  subs: ['Inner','System','Outer','Kuiper','Oort'] },
    { k: 'sky',    label: 'Sky',    subs: ['Constellations','Asterisms','Stars','Deep space'] },
    { k: 'layers', label: 'Layers', subs: ['NEOs','Comets','Meteors','Satellites'] },
    { k: 'info',   label: 'Info',   subs: ['About','Shortcuts'] },
    { k: 'dice',   label: 'Dice' },
  ];

  // Narrowed UPWARD arc, measured CSS-screen (up = negative Y). Endpoints pulled
  // off the pure-horizontal extremes: 200°..340° keeps every item in the
  // upper-middle band, away from the dead bottom corners.
  const ARC_START = 200, ARC_END = 340; // degrees, screen-measured
  const RADIUS = 138;                    // single shared arc radius for both tiers

  const stage   = document.getElementById('stage');
  const hub      = document.getElementById('hub');
  const crumbWho = document.getElementById('crumbWho');
  const shimmer  = document.getElementById('shimmer');

  // place N nodes evenly across the arc; returns [{x,y}]
  function arcSlots(n) {
    const slots = [];
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : i / (n - 1);
      const deg = ARC_START + t * (ARC_END - ARC_START);
      const a = deg * Math.PI / 180;
      slots.push({ x: Math.cos(a) * RADIUS, y: Math.sin(a) * RADIUS });
    }
    return slots;
  }

  // build a node element for either tier
  function makeNode(html, label, opts) {
    const el = document.createElement('div');
    el.className = 'node' + (opts.hasSub ? ' has-sub' : '') + (opts.sub ? ' sub' : '');
    el.innerHTML =
      '<button class="ico"' + (opts.k ? ' data-k="' + opts.k + '"' : '') +
        ' aria-label="' + label + '" tabindex="-1">' + html + '</button>' +
      '<span class="lbl">' + label + '</span>';
    return el;
  }

  // ─── state ──────────────────────────────────────────────────
  let level = 0;          // 0 collapsed, 1 primaries, 2 subs (in-place)
  let openPrimary = -1;   // index of the primary whose subs are shown
  let focusIdx = -1;      // -1 = hub focused; else index within the active tier
  let tier = [];          // currently rendered node elements

  function flashHub() {
    hub.classList.remove('flash'); void hub.offsetWidth; hub.classList.add('flash');
    setTimeout(() => hub.classList.remove('flash'), 520);
  }
  function pulseShimmer() {
    shimmer.classList.remove('run'); void shimmer.offsetWidth; shimmer.classList.add('run');
  }

  // crossfade old tier out (in place), then render+bloom the new one
  function renderTier(entries, opts) {
    const dying = tier;
    dying.forEach(el => { el.classList.remove('shown'); el.classList.add('fading'); });
    setTimeout(() => dying.forEach(el => el.remove()), 220);

    const slots = arcSlots(entries.length);
    tier = entries.map((e, i) => {
      const el = makeNode(e.html, e.label, e.opts || {});
      el.dataset.idx = i;
      if (e.k) el.dataset.k = e.k;
      el.style.setProperty('--x', slots[i].x.toFixed(1) + 'px');
      el.style.setProperty('--y', slots[i].y.toFixed(1) + 'px');
      stage.appendChild(el);
      return el;
    });
    // stagger the bloom (≤200ms overlapped)
    requestAnimationFrame(() => {
      tier.forEach((el, i) => {
        el.style.setProperty('--delay', (i * 0.03).toFixed(2) + 's');
        el.classList.add('shown');
      });
    });
  }

  function showPrimaries() {
    renderTier(PRIMARY.map(p => ({
      html: ICONS[p.k], label: p.label, k: p.k,
      opts: { k: p.k, hasSub: !!p.subs },
    })));
  }
  function showSubs(pi) {
    const p = PRIMARY[pi];
    renderTier(p.subs.map(label => {
      const isConst = p.k === 'sky' && label === 'Constellations';
      return {
        html: (isConst ? ICONS.sky : ICONS.dot), label,
        opts: { sub: true },
      };
    }));
  }

  function setHubBack(parentLabel) {
    hub.classList.add('back');
    crumbWho.textContent = parentLabel || '';
    hub.setAttribute('aria-label', 'Back to ' + (parentLabel || 'controls'));
  }
  function setHubHome(expanded) {
    hub.classList.remove('back');
    hub.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    hub.setAttribute('aria-label', 'Bloom or collapse the controls');
  }

  function toLevel1() {
    level = 1; openPrimary = -1;
    showPrimaries();
    setHubHome(true);
    flashHub();
    focusIdx = 0; paintFocus();
  }
  function collapse() {
    level = 0; openPrimary = -1;
    const dying = tier; tier = [];
    dying.forEach(el => { el.classList.remove('shown'); el.classList.add('fading'); });
    setTimeout(() => dying.forEach(el => el.remove()), 220);
    setHubHome(false);
    flashHub();
    focusIdx = -1; clearFocusRing();
  }
  function toLevel2(pi) {
    level = 2; openPrimary = pi;
    showSubs(pi);
    setHubBack(PRIMARY[pi].label);
    focusIdx = 0; paintFocus();
  }
  function backToLevel1() {
    level = 1; openPrimary = -1;
    showPrimaries();
    setHubHome(true);
    focusIdx = 0; paintFocus();
  }

  function activatePrimary(pi) {
    if (pi < 0 || pi >= PRIMARY.length) return;
    const p = PRIMARY[pi];
    if (p.subs) { toLevel2(pi); return; }
    pulseShimmer(); // direct action (Tour / Dice)
  }
  function activateSub(idx) {
    const p = PRIMARY[openPrimary];
    if (!p) return;
    const label = p.subs[idx];
    if (p.k === 'sky' && label === 'Constellations') {
      const ico = tier[idx] && tier[idx].querySelector('.ico');
      if (ico) ico.classList.add('lit'); // .lit sky-ignite
    }
    pulseShimmer();
  }

  // ─── remote focus painting ──────────────────────────────────
  function clearFocusRing() {
    document.querySelectorAll('.node.remote-focus').forEach(n => n.classList.remove('remote-focus'));
    hub.classList.remove('remote-focus');
  }
  function paintFocus() {
    clearFocusRing();
    if (level === 0 || focusIdx < 0) { hub.classList.add('remote-focus'); return; }
    const el = tier[focusIdx];
    if (el) el.classList.add('remote-focus');
  }

  // ─── pointer wiring ─────────────────────────────────────────
  hub.addEventListener('click', () => {
    if (level === 0) toLevel1();
    else if (level === 2) backToLevel1(); // hub is Back
    else collapse();
  });
  stage.addEventListener('click', (e) => {
    const ico = e.target.closest('.ico');
    if (!ico) return;
    const node = ico.closest('.node');
    if (!node || node.classList.contains('fading')) return;
    const idx = parseInt(node.dataset.idx, 10);
    if (Number.isNaN(idx)) return;
    if (level === 2) activateSub(idx);
    else activatePrimary(idx);
  });

  // ─── Apple TV / Siri Remote simulation ──────────────────────
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'Escape' || k === 'Backspace') {
      if (level === 2) { backToLevel1(); e.preventDefault(); }
      else if (level === 1) { collapse(); e.preventDefault(); }
      return;
    }
    if (level === 0) {
      if (k === 'Enter' || k === ' ') { toLevel1(); e.preventDefault(); }
      return;
    }
    const n = tier.length;
    if (k === 'ArrowRight') { focusIdx = (focusIdx + 1) % n; paintFocus(); e.preventDefault(); }
    else if (k === 'ArrowLeft') { focusIdx = (focusIdx - 1 + n) % n; paintFocus(); e.preventDefault(); }
    else if (k === 'Enter' || k === ' ') {
      if (level === 1) activatePrimary(focusIdx);
      else activateSub(focusIdx);
      e.preventDefault();
    }
  });
</script>
</body>
</html>
