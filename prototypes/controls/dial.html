<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>orrery controls · radial dial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #86b8ff; --accent-rgb: 134, 184, 255;
    --ink: #eaf0ff;
    --glass: rgba(255,255,255,0.05); --glass-hi: rgba(255,255,255,0.12);
    --stroke: rgba(255,255,255,0.16);
    --chip: 44px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 70% 25%, rgba(20,28,60,0.45), transparent 60%),
      radial-gradient(ellipse at 25% 85%, rgba(40,20,55,0.35), transparent 55%),
      #04050c;
    color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden; height: 100dvh;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
      radial-gradient(1px 1px at 80% 60%, #fff6, transparent),
      radial-gradient(1px 1px at 50% 80%, #fff5, transparent),
      radial-gradient(1px 1px at 65% 15%, #fff7, transparent),
      radial-gradient(1px 1px at 35% 55%, #fff5, transparent);
  }
  .caption { position: fixed; top: 28px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.5); font-size: 15px; letter-spacing: 3px;
    text-transform: uppercase; font-weight: 300; }
  .hint { position: fixed; bottom: 24px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.32); font-size: 14px; font-style: italic; }

  /* ─── dial ────────────────────────────────────────────────── */
  .dial {
    position: fixed; top: 50%; left: 50%; width: 340px; height: 340px;
    margin: -170px 0 0 -170px; z-index: 2;
  }
  .dial svg { width: 100%; height: 100%; display: block; overflow: visible; }
  /* collapsed -> expanded: a one-time settle, no looping */
  .wheel { transform-origin: 170px 170px; transform: scale(0.18) rotate(-8deg); opacity: 0;
    transition: transform 0.8s var(--ease), opacity 0.5s var(--ease); }
  .dial.open .wheel { transform: scale(1) rotate(0deg); opacity: 1; }

  .wedge { fill: var(--glass); stroke: var(--stroke); stroke-width: 1;
    cursor: pointer; transition: fill 0.25s, stroke 0.25s, transform 0.3s var(--ease); transform-origin: 170px 170px; }
  .wedge:hover { fill: var(--glass-hi); }
  /* crisp lift + brighten on hover, focus, and remote-focus */
  .seg:hover .wedge,
  .seg.focus .wedge { transform: scale(1.06); fill: var(--glass-hi);
    stroke: rgba(var(--accent-rgb),0.6);
    filter: drop-shadow(0 0 6px rgba(var(--accent-rgb),0.28)); }
  .seg.active .wedge { fill: var(--glass-hi); stroke: rgba(var(--accent-rgb),0.55); }

  .rim { fill: none; stroke: rgba(var(--accent-rgb),0.18); stroke-width: 1; }
  .tick { stroke: rgba(var(--accent-rgb),0.3); stroke-width: 1; }
  .tick.major { stroke: rgba(var(--accent-rgb),0.5); }

  .glyph { color: rgba(255,255,255,0.7); transition: color 0.25s, opacity 0.25s; pointer-events: none; }
  .seg:hover .glyph, .seg.focus .glyph, .seg.active .glyph { color: var(--ink); }
  .glyph svg { width: 22px; height: 22px; }
  .lbl { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; font-family: inherit;
    fill: rgba(255,255,255,0.45); text-anchor: middle; opacity: 0; transition: opacity 0.2s, fill 0.2s; pointer-events: none; }
  .seg:hover .lbl, .seg.focus .lbl, .seg.active .lbl { opacity: 1; }
  .seg.focus .lbl { fill: var(--accent); }

  /* center hub */
  .hub { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px;
    margin: -32px 0 0 -32px; border-radius: 50%; cursor: pointer; z-index: 4;
    background: radial-gradient(circle at 38% 34%, #ffe9b8, #f0a338 60%, #c8761b);
    box-shadow: 0 0 22px rgba(240,163,56,0.5), 0 0 52px rgba(240,163,56,0.22);
    border: none; display: grid; place-items: center; color: #2a1a06;
    animation: pulse 6s ease-in-out infinite; transition: transform 0.4s var(--ease); }
  .hub:hover { transform: scale(1.06); }
  .hub svg { width: 22px; height: 22px; }
  @keyframes pulse { 50% { box-shadow: 0 0 30px rgba(240,163,56,0.7), 0 0 78px rgba(240,163,56,0.32); } }

  /* center hub label: shows the remote-focused wedge name */
  .hub-lbl { position: absolute; top: 50%; left: 50%; transform: translate(-50%, 44px);
    z-index: 4; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent); opacity: 0; transition: opacity 0.25s; pointer-events: none;
    text-shadow: 0 0 10px rgba(var(--accent-rgb),0.5); white-space: nowrap; }
  .dial.remote .hub-lbl { opacity: 1; }

  /* sky wedge lit */
  .seg.lit .wedge { fill: rgba(var(--accent-rgb),0.26); stroke: rgba(var(--accent-rgb),0.75);
    filter: drop-shadow(0 0 8px rgba(var(--accent-rgb),0.4)); }
  .seg.lit .glyph { color: var(--accent); }
  .seg.lit .glyph svg { filter: drop-shadow(0 0 4px rgba(var(--accent-rgb),0.9)); }
  .sky-lines { stroke-dasharray: 60; stroke-dashoffset: 60; transition: stroke-dashoffset 0.7s var(--ease); }
  .seg.lit .sky-lines { stroke-dashoffset: 0; }

  .shimmer { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 1;
    background: linear-gradient(115deg, transparent 35%, rgba(var(--accent-rgb),0.16) 50%, transparent 65%);
    background-size: 250% 100%; }
  .shimmer.run { animation: sweep 1.1s var(--ease) forwards; }
  @keyframes sweep { 0% { opacity:0; background-position:120% 0; } 25% { opacity:1; } 100% { opacity:0; background-position:-40% 0; } }

  @media (prefers-reduced-motion: reduce) {
    .wheel, .hub { animation: none !important; }
    .wheel { transition: opacity 0.3s; transform: scale(1) rotate(0deg); }
    .sky-lines { transition: none; }
    .shimmer.run { animation: none; }
  }
</style>
</head>
<body>
  <div class="caption">Radial dial</div>
  <div class="shimmer" id="shimmer"></div>

  <div class="dial" id="dial">
    <svg viewBox="0 0 340 340" id="svg">
      <g class="wheel" id="wheel">
        <circle class="rim" cx="170" cy="170" r="158"/>
        <circle class="rim" cx="170" cy="170" r="66"/>
        <g id="ticks"></g>
        <g id="segs"></g>
      </g>
    </svg>
    <button class="hub" id="hub" aria-label="Toggle controls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    </button>
    <div class="hub-lbl" id="hubLbl"></div>
  </div>

  <div class="hint">Tap the sun to open · hover a wedge to read it · tap the sky wedge to ignite it · Remote: arrows move · select activates</div>

<script>
  const ICONS = {
    tour: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>',
    dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor" stroke="none"/></svg>',
    sky: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline class="sky-lines" points="4,15 9,7 14,13 20,5"/><circle cx="4" cy="15" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="7" r="1.4" fill="currentColor" stroke="none"/><circle cx="14" cy="13" r="1.4" fill="currentColor" stroke="none"/><circle cx="20" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg>',
    zin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>',
    zout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="12" x2="18" y2="12"/></svg>',
    info: '<span style="font-size:18px;font-style:italic;">i</span>',
    help: '<span style="font-size:18px;">?</span>',
  };
  const WEDGES = [
    ['tour','Tour'], ['dice','Dice'], ['sky','Sky'], ['zin','Zoom in'],
    ['zout','Zoom out'], ['info','About'], ['help','Keys'],
  ];

  const CX = 170, CY = 170, R_OUT = 156, R_IN = 68, R_GLYPH = 118, R_LBL = 142;
  const SVGNS = 'http://www.w3.org/2000/svg';
  const N = WEDGES.length, STEP = 360 / N;
  // start the first wedge centered at the top (12 o'clock)
  const OFFSET = -90 - STEP / 2;
  const pt = (r, deg) => {
    const a = (deg * Math.PI) / 180;
    return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
  };

  const segs = document.getElementById('segs');
  const segNodes = [];
  WEDGES.forEach(([k, label], i) => {
    const a0 = OFFSET + i * STEP, a1 = a0 + STEP, mid = a0 + STEP / 2;
    const [ox0, oy0] = pt(R_OUT, a0), [ox1, oy1] = pt(R_OUT, a1);
    const [ix1, iy1] = pt(R_IN, a1), [ix0, iy0] = pt(R_IN, a0);
    const d = `M ${ox0} ${oy0} A ${R_OUT} ${R_OUT} 0 0 1 ${ox1} ${oy1} ` +
              `L ${ix1} ${iy1} A ${R_IN} ${R_IN} 0 0 0 ${ix0} ${iy0} Z`;

    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'seg'); g.dataset.k = k; g.dataset.label = label;

    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('class', 'wedge'); path.setAttribute('d', d);
    g.appendChild(path);

    // icon at the wedge mid-angle
    const [gx, gy] = pt(R_GLYPH, mid);
    const fo = document.createElementNS(SVGNS, 'foreignObject');
    fo.setAttribute('class', 'glyph');
    fo.setAttribute('x', gx - 14); fo.setAttribute('y', gy - 14);
    fo.setAttribute('width', 28); fo.setAttribute('height', 28);
    fo.innerHTML = '<div xmlns="http://www.w3.org/1999/xhtml" style="display:grid;place-items:center;width:28px;height:28px;color:inherit;">' + ICONS[k] + '</div>';
    g.appendChild(fo);

    // label at the wedge mid-angle
    const [lx, ly] = pt(R_LBL, mid);
    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('class', 'lbl'); t.setAttribute('x', lx); t.setAttribute('y', ly + 3);
    t.textContent = label;
    g.appendChild(t);

    segs.appendChild(g);
    segNodes.push(g);
  });

  // rim tick marks — static
  const ticks = document.getElementById('ticks');
  for (let i = 0; i < 72; i++) {
    const deg = i * 5, major = i % 6 === 0;
    const [x0, y0] = pt(R_OUT + 2, deg), [x1, y1] = pt(R_OUT + (major ? 9 : 5), deg);
    const ln = document.createElementNS(SVGNS, 'line');
    ln.setAttribute('class', 'tick' + (major ? ' major' : ''));
    ln.setAttribute('x1', x0); ln.setAttribute('y1', y0);
    ln.setAttribute('x2', x1); ln.setAttribute('y2', y1);
    ticks.appendChild(ln);
  }

  const dial = document.getElementById('dial');
  const shimmer = document.getElementById('shimmer');
  const hubLbl = document.getElementById('hubLbl');
  document.getElementById('hub').addEventListener('click', () => dial.classList.toggle('open'));

  function activate(seg) {
    segNodes.forEach((s) => { if (s !== seg) s.classList.remove('active'); });
    if (seg.dataset.k === 'sky') {
      if (seg.classList.toggle('lit')) {
        shimmer.classList.remove('run'); void shimmer.offsetWidth; shimmer.classList.add('run');
      }
    } else {
      seg.classList.toggle('active');
    }
  }

  segs.addEventListener('click', (e) => {
    const seg = e.target.closest('.seg');
    if (seg) activate(seg);
  });

  // ─── Apple TV / Siri-Remote simulation ───────────────────────
  let remoteIdx = -1;
  function setRemote(idx) {
    remoteIdx = (idx + N) % N;
    segNodes.forEach((s) => s.classList.remove('focus'));
    const seg = segNodes[remoteIdx];
    seg.classList.add('focus');
    dial.classList.add('remote');
    hubLbl.textContent = seg.dataset.label;
  }

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowRight': case 'ArrowDown':
        e.preventDefault(); setRemote(remoteIdx < 0 ? 0 : remoteIdx + 1); break;
      case 'ArrowLeft': case 'ArrowUp':
        e.preventDefault(); setRemote(remoteIdx < 0 ? N - 1 : remoteIdx - 1); break;
      case 'Enter': case ' ':
        if (remoteIdx >= 0) { e.preventDefault(); activate(segNodes[remoteIdx]); }
        break;
    }
  });

  // open on load so the dial is visible
  requestAnimationFrame(() => dial.classList.add('open'));
</script>
</body>
</html>
