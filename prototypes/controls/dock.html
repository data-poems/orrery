<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>orrery controls · bottom dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #86b8ff;
    --accent-rgb: 134, 184, 255;
    --ink: #eaf0ff;
    --glass: rgba(255,255,255,0.05);
    --glass-hi: rgba(255,255,255,0.11);
    --stroke: rgba(255,255,255,0.14);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 70% 30%, rgba(20,28,60,0.45), transparent 60%),
      radial-gradient(ellipse at 30% 80%, rgba(40,20,55,0.35), transparent 55%),
      #04050c;
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
    height: 100dvh;
  }
  /* faint starfield */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
      radial-gradient(1px 1px at 80% 60%, #fff6, transparent),
      radial-gradient(1px 1px at 50% 80%, #fff5, transparent),
      radial-gradient(1px 1px at 65% 15%, #fff7, transparent),
      radial-gradient(1px 1px at 35% 55%, #fff5, transparent);
    background-size: 100% 100%;
  }
  .caption {
    position: fixed; top: 28px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.5); font-size: 15px; letter-spacing: 3px;
    text-transform: uppercase; font-weight: 300;
  }
  /* dock sits at the bottom, so float the hint near the top */
  .hint { position: fixed; top: 58px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.32); font-size: 14px; font-style: italic; }

  /* ─── bottom dock ─────────────────────────────────────────── */
  .dock {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(0);
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: var(--glass); border: 1px solid var(--stroke);
    border-radius: 18px;
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: 0 8px 36px rgba(0,0,0,0.45);
    /* entrance */
    opacity: 0; transform: translateX(-50%) translateY(28px);
    animation: dock-rise 0.7s var(--ease) 0.15s forwards;
  }
  @keyframes dock-rise {
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .btn {
    position: relative;
    width: 44px; height: 44px;
    border-radius: 13px;
    background: transparent; border: 1px solid transparent;
    color: var(--ink); cursor: pointer;
    display: grid; place-items: center;
    transition: background 0.25s, border-color 0.25s, box-shadow 0.4s, transform 0.2s var(--ease);
  }
  .btn:hover { background: var(--glass-hi); border-color: rgba(var(--accent-rgb),0.5); }
  .btn:active { transform: scale(0.92); }
  .btn svg { width: 20px; height: 20px; }
  .btn .lbl {
    position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(255,255,255,0.55); white-space: nowrap;
    padding: 3px 8px; border-radius: 7px;
    background: rgba(8,10,20,0.85); border: 1px solid var(--stroke);
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .btn:hover .lbl, .btn.remote-focus .lbl { opacity: 1; }
  /* Apple-TV style accent focus ring */
  .btn.remote-focus {
    background: var(--glass-hi);
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(var(--accent-rgb),0.5), 0 0 18px rgba(var(--accent-rgb),0.45);
  }

  .divider {
    width: 1px; height: 24px; margin: 0 2px;
    background: var(--stroke);
  }

  /* sky control lit state */
  .btn.lit {
    background: rgba(var(--accent-rgb), 0.26);
    border-color: rgba(var(--accent-rgb), 0.7);
    box-shadow: 0 0 14px rgba(var(--accent-rgb),0.55), 0 0 32px rgba(var(--accent-rgb),0.3);
  }
  .btn.lit svg { color: var(--accent); filter: drop-shadow(0 0 4px rgba(var(--accent-rgb),0.9)); }

  /* one-time sky shimmer sweep */
  .shimmer {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 1;
    background: linear-gradient(115deg, transparent 35%, rgba(var(--accent-rgb),0.16) 50%, transparent 65%);
    background-size: 250% 100%;
  }
  .shimmer.run { animation: sweep 1.1s var(--ease) forwards; }
  @keyframes sweep {
    0% { opacity: 0; background-position: 120% 0; }
    25% { opacity: 1; }
    100% { opacity: 0; background-position: -40% 0; }
  }
  /* constellation glyph stroke-in */
  .sky-lines { stroke-dasharray: 60; stroke-dashoffset: 60; transition: stroke-dashoffset 0.7s var(--ease); }
  .lit .sky-lines { stroke-dashoffset: 0; }

  @media (prefers-reduced-motion: reduce) {
    .btn, .sky-lines { transition: none !important; }
    .dock { animation: none; opacity: 1; transform: translateX(-50%) translateY(0); }
    .shimmer.run { animation: none; }
  }
</style>
</head>
<body>
  <div class="caption">Bottom dock</div>
  <div class="hint">A slim, always-on dock · remote: ◀ ▶ move, select activates</div>
  <div class="shimmer" id="shimmer"></div>

  <div class="dock" id="dock"></div>

<script>
  // icon set — minimal inline SVGs (verbatim from orbital hub study)
  const ICONS = {
    tour: '<svg viewBox="0 0 24 24" fill="none"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>',
    dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor" stroke="none"/></svg>',
    sky: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline class="sky-lines" points="4,15 9,7 14,13 20,5"/><circle cx="4" cy="15" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="7" r="1.4" fill="currentColor" stroke="none"/><circle cx="14" cy="13" r="1.4" fill="currentColor" stroke="none"/><circle cx="20" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg>',
    zin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>',
    zout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="12" x2="18" y2="12"/></svg>',
    info: '<span style="font-size:18px;font-style:italic;">i</span>',
    help: '<span style="font-size:18px;">?</span>',
  };
  // dock order: tour, dice, sky | zout, zin | info, help
  const ITEMS = [
    { k: 'tour', label: 'Tour' },
    { k: 'dice', label: 'Dice' },
    { k: 'sky',  label: 'Sky' },
    { div: true },
    { k: 'zout', label: 'Zoom out' },
    { k: 'zin',  label: 'Zoom in' },
    { div: true },
    { k: 'info', label: 'About' },
    { k: 'help', label: 'Keys' },
  ];

  const dock = document.getElementById('dock');
  ITEMS.forEach(it => {
    if (it.div) {
      const d = document.createElement('div');
      d.className = 'divider';
      dock.appendChild(d);
      return;
    }
    const b = document.createElement('button');
    b.className = 'btn'; b.dataset.k = it.k;
    b.setAttribute('aria-label', it.label);
    b.innerHTML = ICONS[it.k] + '<span class="lbl">' + it.label + '</span>';
    dock.appendChild(b);
  });

  const shimmer = document.getElementById('shimmer');
  function activate(btn) {
    if (!btn) return;
    if (btn.dataset.k === 'sky') {
      const lit = btn.classList.toggle('lit');
      if (lit) { shimmer.classList.remove('run'); void shimmer.offsetWidth; shimmer.classList.add('run'); }
    } else {
      btn.animate([{ transform: 'scale(0.9)' }, { transform: 'scale(1)' }], { duration: 180 });
    }
  }
  // pointer activate
  document.addEventListener('click', (e) => activate(e.target.closest('.btn')));

  // Apple-TV / Siri-Remote simulation: arrows move a focus ring, select activates.
  const btns = [...dock.querySelectorAll('.btn')];
  let focusIdx = 0;
  function paintFocus() { btns.forEach((b, i) => b.classList.toggle('remote-focus', i === focusIdx)); }
  paintFocus();
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { focusIdx = (focusIdx + 1) % btns.length; paintFocus(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { focusIdx = (focusIdx - 1 + btns.length) % btns.length; paintFocus(); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { activate(btns[focusIdx]); e.preventDefault(); }
  });
</script>
</body>
</html>
