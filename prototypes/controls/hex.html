<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>orrery controls · hex cluster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #86b8ff; --accent-rgb: 134, 184, 255;
    --ink: #eaf0ff;
    --glass: rgba(255,255,255,0.05); --glass-hi: rgba(255,255,255,0.12);
    --stroke: rgba(255,255,255,0.16);
    --hex: 96px;            /* flat-top hex width (point-to-point, horizontal) */
    --sub: 60px;            /* sub-hex width */
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 70% 25%, rgba(20,28,60,0.45), transparent 60%),
      radial-gradient(ellipse at 25% 85%, rgba(40,20,55,0.35), transparent 55%),
      #04050c;
    color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden; height: 100dvh;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
      radial-gradient(1px 1px at 80% 60%, #fff6, transparent),
      radial-gradient(1px 1px at 50% 80%, #fff5, transparent),
      radial-gradient(1px 1px at 65% 15%, #fff7, transparent),
      radial-gradient(1px 1px at 35% 55%, #fff5, transparent);
  }
  .caption { position: fixed; top: 28px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.5); font-size: 15px; letter-spacing: 3px;
    text-transform: uppercase; font-weight: 300; }
  .hint { position: fixed; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.32); font-size: 14px; font-style: italic; }
  .hint.bottom { bottom: 24px; }
  .hint.remote { bottom: 52px; letter-spacing: 0.5px; }

  /* ─── flat-top honeycomb cluster ──────────────────────────── */
  .cluster { position: fixed; top: 50%; left: 50%; width: 0; height: 0; }
  /* static rigid body — all tiles ride this, packing stays flush */
  .comb { position: absolute; left: 0; top: 0; width: 0; height: 0; }

  .tile {
    position: absolute; left: 0; top: 0;
    width: var(--hex); height: calc(var(--hex) * 0.8660254); /* flat-top: h = w·√3/2 */
    margin: calc(var(--hex) * -0.4330127) 0 0 calc(var(--hex) / -2); /* center on origin */
    transform: translate(var(--x), var(--y));
    transition: opacity 0.3s var(--ease);
  }
  .tile .face {
    width: 100%; height: 100%; cursor: pointer; position: relative;
    display: grid; place-items: center;
    /* flat-top: flat edges top & bottom, points left & right */
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: var(--glass); border: none; color: var(--ink); padding: 0;
    backdrop-filter: blur(12px) saturate(1.4); -webkit-backdrop-filter: blur(12px) saturate(1.4);
    box-shadow: inset 0 0 0 1px var(--stroke), inset 0 1px 0 0 var(--glass-hi);
    transition: background 0.25s, box-shadow 0.4s, transform 0.25s var(--ease);
  }
  /* subtle inner highlight along the top facets */
  .tile .face::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    clip-path: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), transparent 42%);
    opacity: 0.8;
  }
  .tile .ico { display: grid; place-items: center; pointer-events: none; position: relative; z-index: 1; }
  .tile .face:hover {
    background: var(--glass-hi); transform: scale(1.06);
    box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb),0.55),
                0 0 16px rgba(var(--accent-rgb),0.4), 0 0 36px rgba(var(--accent-rgb),0.2);
  }
  .tile svg { width: 22px; height: 22px; display: block; }

  /* center hex — the hub: brighter, ringed, slightly raised */
  .tile.center .face {
    background: radial-gradient(circle at 40% 33%, rgba(var(--accent-rgb),0.30), rgba(var(--accent-rgb),0.10) 55%, var(--glass) 80%);
    box-shadow: inset 0 0 0 1.5px rgba(var(--accent-rgb),0.55),
                0 0 26px rgba(var(--accent-rgb),0.26), 0 0 60px rgba(var(--accent-rgb),0.10);
  }
  .tile.center .face:hover { transform: scale(1.07); }

  .tile .lbl {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    margin-top: 4px; font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
    color: rgba(255,255,255,0.5); white-space: nowrap; opacity: 0; transition: opacity 0.2s;
  }
  .tile .face:hover ~ .lbl, .tile.focused .lbl { opacity: 1; }

  /* remote / Siri-Remote focus ring */
  .tile.focused .face {
    box-shadow: inset 0 0 0 2px rgba(var(--accent-rgb),0.9),
                0 0 18px rgba(var(--accent-rgb),0.5), 0 0 40px rgba(var(--accent-rgb),0.28);
    transform: scale(1.07);
  }

  /* dimmed when a sub-ring is open elsewhere */
  .comb.expanded .tile:not(.active) { opacity: 0.22; pointer-events: none; }
  .comb.expanded .tile.active .face {
    box-shadow: inset 0 0 0 1.5px rgba(var(--accent-rgb),0.8),
                0 0 24px rgba(var(--accent-rgb),0.45);
  }

  /* ─── sub-hex ring (second level) ─────────────────────────── */
  .sub {
    position: absolute; left: 0; top: 0;
    width: var(--sub); height: calc(var(--sub) * 0.8660254);
    margin: calc(var(--sub) * -0.4330127) 0 0 calc(var(--sub) / -2);
    transform: translate(var(--bx), var(--by)) scale(0.3);
    opacity: 0;
    transition: transform 0.34s var(--ease), opacity 0.28s var(--ease);
  }
  .sub.bloom { transform: translate(var(--x), var(--y)) scale(1); opacity: 1; }
  .sub .face {
    width: 100%; height: 100%; cursor: pointer; position: relative;
    display: grid; place-items: center;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: rgba(var(--accent-rgb),0.07); border: none; color: var(--ink); padding: 0;
    backdrop-filter: blur(10px) saturate(1.4); -webkit-backdrop-filter: blur(10px) saturate(1.4);
    box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb),0.3), inset 0 1px 0 0 var(--glass-hi);
    transition: background 0.2s, box-shadow 0.3s, transform 0.2s var(--ease);
  }
  .sub .face::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; clip-path: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 42%);
  }
  .sub .face span { font-size: 9px; letter-spacing: 0.6px; text-transform: uppercase;
    text-align: center; line-height: 1.1; padding: 0 4px; position: relative; z-index: 1; }
  .sub .face:hover, .sub.focused .face {
    background: rgba(var(--accent-rgb),0.18); transform: scale(1.08);
    box-shadow: inset 0 0 0 1.5px rgba(var(--accent-rgb),0.75),
                0 0 14px rgba(var(--accent-rgb),0.4);
  }

  /* sky control lit */
  .face.lit { background: rgba(var(--accent-rgb),0.26) !important;
    box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb),0.75),
                0 0 14px rgba(var(--accent-rgb),0.55), 0 0 32px rgba(var(--accent-rgb),0.3) !important; }
  .face.lit svg { color: var(--accent); filter: drop-shadow(0 0 4px rgba(var(--accent-rgb),0.9)); }
  .sky-lines { stroke-dasharray: 60; stroke-dashoffset: 60; transition: stroke-dashoffset 0.7s var(--ease); }
  .face.lit .sky-lines { stroke-dashoffset: 0; }

  .shimmer { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 1;
    background: linear-gradient(115deg, transparent 35%, rgba(var(--accent-rgb),0.16) 50%, transparent 65%);
    background-size: 250% 100%; }
  .shimmer.run { animation: sweep 1.1s var(--ease) forwards; }
  @keyframes sweep { 0% { opacity:0; background-position:120% 0; } 25% { opacity:1; } 100% { opacity:0; background-position:-40% 0; } }

  @media (prefers-reduced-motion: reduce) {
    .sky-lines, .tile, .sub, .tile .face, .sub .face { transition: none; }
    .sub { transform: translate(var(--bx), var(--by)) scale(1); }
    .sub.bloom { transform: translate(var(--x), var(--y)) scale(1); }
    .shimmer.run { animation: none; }
  }
</style>
</head>
<body>
  <div class="caption">Hex cluster</div>
  <div class="shimmer" id="shimmer"></div>

  <div class="cluster" id="cluster">
    <div class="comb" id="comb"></div>
  </div>

  <div class="hint remote">Remote: arrows move · select opens/activates · back collapses</div>
  <div class="hint bottom">Flat-top honeycomb · tap a tile with sub-options to bloom the next ring</div>

<script>
  const ICONS = {
    tour: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>',
    dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor" stroke="none"/></svg>',
    sky: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline class="sky-lines" points="4,15 9,7 14,13 20,5"/><circle cx="4" cy="15" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="7" r="1.4" fill="currentColor" stroke="none"/><circle cx="14" cy="13" r="1.4" fill="currentColor" stroke="none"/><circle cx="20" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg>',
    scale: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="2.4"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="9.5"/></svg>',
    layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 4 4 8l8 4 8-4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/></svg>',
    info: '<span style="font-size:18px;font-style:italic;">i</span>',
    help: '<span style="font-size:18px;">?</span>',
  };

  // Flat-top honeycomb packing. Hex width W (point-to-point, horizontal),
  // height H = W·√3/2 (flat-to-flat, vertical). The six flush neighbours of a
  // flat-top hex sit at center-to-center offsets:
  //   top ( 0, -H )  bottom ( 0, +H )
  //   rup ( +0.75W, -0.5H )  lup ( -0.75W, -0.5H )
  //   rdn ( +0.75W, +0.5H )  ldn ( -0.75W, +0.5H )
  // 0.75W horizontal step packs each column so a neighbour's left point meets
  // this hex's right edge with zero gap; ±0.5H vertical interleave keeps the
  // shared diagonal edges flush.
  const W = 96, H = W * 0.8660254;
  const SW = 60, SH = SW * 0.8660254;
  const ring = (w, h) => ({
    top: { x: 0, y: -h }, bottom: { x: 0, y: h },
    rup: { x: 0.75 * w, y: -0.5 * h }, rdn: { x: 0.75 * w, y: 0.5 * h },
    lup: { x: -0.75 * w, y: -0.5 * h }, ldn: { x: -0.75 * w, y: 0.5 * h },
  });
  const OFFS = ring(W, H);
  const SUBOFF = ring(SW, SH);          // sub-hex offsets relative to parent
  const SUBORDER = ['top', 'rup', 'rdn', 'bottom', 'ldn', 'lup']; // bloom sequence (cw)

  // Center hub + six flush neighbours. Some carry sub-options.
  const TILES = [
    { id: 'help', k: 'help', label: 'Keys', pos: { x: 0, y: 0 }, center: true },
    { id: 'lup',  k: 'tour', label: 'Tour', pos: OFFS.lup },
    { id: 'top',  k: 'sky',  label: 'Sky',  pos: OFFS.top,
      subs: ['Constellations', 'Asterisms', 'Stars', 'Deep space'] },
    { id: 'rup',  k: 'dice', label: 'Dice', pos: OFFS.rup },
    { id: 'rdn',  k: 'layers', label: 'Layers', pos: OFFS.rdn,
      subs: ['NEOs', 'Comets', 'Meteors', 'Satellites'] },
    { id: 'bottom', k: 'scale', label: 'Scale', pos: OFFS.bottom,
      subs: ['Inner', 'System', 'Outer', 'Kuiper', 'Oort'] },
    { id: 'ldn',  k: 'info', label: 'Info', pos: OFFS.ldn,
      subs: ['About', 'Shortcuts'] },
  ];
  const TILE_BY = Object.fromEntries(TILES.map(t => [t.id, t]));

  // Spatial adjacency for remote navigation across the primary ring.
  const NAV = {
    help:   { up: 'top',  down: 'bottom', left: 'lup', right: 'rup' },
    top:    { up: null,   down: 'help',   left: 'lup', right: 'rup' },
    rup:    { up: 'top',  down: 'rdn',    left: 'help', right: null },
    rdn:    { up: 'rup',  down: 'bottom', left: 'help', right: null },
    bottom: { up: 'help', down: null,     left: 'ldn', right: 'rdn' },
    ldn:    { up: 'lup',  down: 'bottom', left: null,  right: 'help' },
    lup:    { up: 'top',  down: 'ldn',    left: null,  right: 'help' },
  };

  const comb = document.getElementById('comb');
  const shimmer = document.getElementById('shimmer');
  const tileEls = {};

  function makeTile(t) {
    const tile = document.createElement('div');
    tile.className = 'tile' + (t.center ? ' center' : '');
    tile.dataset.id = t.id;
    tile.style.setProperty('--x', t.pos.x.toFixed(2) + 'px');
    tile.style.setProperty('--y', t.pos.y.toFixed(2) + 'px');
    const face = document.createElement('button');
    face.className = 'face'; face.dataset.k = t.k; face.dataset.id = t.id;
    face.setAttribute('aria-label', t.label); face.setAttribute('tabindex', '-1');
    const ico = document.createElement('span'); ico.className = 'ico'; ico.innerHTML = ICONS[t.k];
    face.appendChild(ico);
    const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = t.label;
    tile.appendChild(face); tile.appendChild(lbl);
    comb.appendChild(tile);
    tileEls[t.id] = tile;
  }
  TILES.forEach(makeTile);

  // ─── second level: sub-hex ring ─────────────────────────────
  let openId = null;          // primary id whose sub-ring is bloomed
  let subEls = [];            // current sub-hex elements
  let subFocus = -1;          // index into subEls when navigating a sub-ring

  function openSub(id) {
    const t = TILE_BY[id];
    if (!t || !t.subs) return false;
    closeSub();
    openId = id;
    comb.classList.add('expanded');
    tileEls[id].classList.add('active');
    const base = t.pos;
    t.subs.forEach((label, i) => {
      const slot = SUBOFF[SUBORDER[i % SUBORDER.length]];
      const sub = document.createElement('div');
      sub.className = 'sub';
      // start position: collapsed onto the parent center
      sub.style.setProperty('--bx', base.x.toFixed(2) + 'px');
      sub.style.setProperty('--by', base.y.toFixed(2) + 'px');
      // bloomed position: parent center + sub offset
      sub.style.setProperty('--x', (base.x + slot.x).toFixed(2) + 'px');
      sub.style.setProperty('--y', (base.y + slot.y).toFixed(2) + 'px');
      const face = document.createElement('button');
      face.className = 'face'; face.dataset.sub = label; face.setAttribute('tabindex', '-1');
      face.innerHTML = '<span>' + label + '</span>';
      sub.appendChild(face);
      comb.appendChild(sub);
      subEls.push(sub);
      // staggered, eased bloom
      requestAnimationFrame(() => setTimeout(() => sub.classList.add('bloom'), i * 55));
    });
    subFocus = 0;
    syncSubFocus();
    return true;
  }

  function closeSub() {
    if (!openId) return;
    comb.classList.remove('expanded');
    tileEls[openId].classList.remove('active');
    subEls.forEach(s => { s.classList.remove('bloom'); setTimeout(() => s.remove(), 320); });
    subEls = []; subFocus = -1; openId = null;
  }

  function syncSubFocus() {
    subEls.forEach((s, i) => s.classList.toggle('focused', i === subFocus));
  }

  // ─── primary activation ─────────────────────────────────────
  function flash(face) {
    face.style.transform = 'scale(1.14)';
    setTimeout(() => { face.style.transform = ''; }, 160);
  }

  function activatePrimary(id) {
    const t = TILE_BY[id];
    if (!t) return;
    if (t.subs) {                       // toggle the sub-ring
      if (openId === id) closeSub(); else openSub(id);
      return;
    }
    flash(tileEls[id].querySelector('.face'));  // direct action (Tour, Dice, Keys)
  }

  function activateSub(label) {
    // Sky → Constellations ignites the sky on the parent Sky hex.
    if (openId === 'top' && label === 'Constellations') {
      const skyFace = tileEls.top.querySelector('.face');
      skyFace.classList.add('lit');
      shimmer.classList.remove('run'); void shimmer.offsetWidth; shimmer.classList.add('run');
    }
  }

  // ─── remote focus ring ──────────────────────────────────────
  let focusId = 'help';
  function setFocus(id) {
    if (!tileEls[id]) return;
    if (tileEls[focusId]) tileEls[focusId].classList.remove('focused');
    focusId = id;
    tileEls[focusId].classList.add('focused');
  }
  setFocus('help');

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (openId) { closeSub(); e.preventDefault(); }
      return;
    }
    const dir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];

    if (openId) {                       // navigating inside a sub-ring
      if (dir) {
        if (dir === 'up' || dir === 'right') subFocus = (subFocus + 1) % subEls.length;
        else subFocus = (subFocus - 1 + subEls.length) % subEls.length;
        syncSubFocus(); e.preventDefault(); return;
      }
      if (e.key === 'Enter' || e.key === ' ') {
        const face = subEls[subFocus] && subEls[subFocus].querySelector('.face');
        if (face) { flash(face); activateSub(face.dataset.sub); }
        e.preventDefault(); return;
      }
      return;
    }

    if (dir) {                          // navigating the primary ring
      const next = NAV[focusId] && NAV[focusId][dir];
      if (next) setFocus(next);
      e.preventDefault(); return;
    }
    if (e.key === 'Enter' || e.key === ' ') {
      activatePrimary(focusId);
      e.preventDefault();
    }
  });

  document.addEventListener('click', (e) => {
    const subFace = e.target.closest('.sub .face');
    if (subFace) {
      subFocus = subEls.findIndex(s => s.contains(subFace));
      syncSubFocus();
      flash(subFace); activateSub(subFace.dataset.sub);
      return;
    }
    const face = e.target.closest('.tile .face');
    if (face) {
      setFocus(face.dataset.id);
      activatePrimary(face.dataset.id);
      return;
    }
    if (openId) closeSub();             // tap empty space collapses
  });
</script>
</body>
</html>
