<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>orrery controls · bloom into the sun</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #86b8ff; --accent-rgb: 134, 184, 255;
    --ink: #eaf0ff;
    --glass: rgba(255,255,255,0.05); --glass-hi: rgba(255,255,255,0.12);
    --stroke: rgba(255,255,255,0.16);
    --chip: 44px;
    --ease: cubic-bezier(0.34, 1.56, 0.64, 1); /* spring-like overshoot */
    --spin: 48s; /* orbital period of the inner ring */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 70% 25%, rgba(20,28,60,0.45), transparent 60%),
      radial-gradient(ellipse at 25% 85%, rgba(40,20,55,0.35), transparent 55%),
      #04050c;
    color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden; height: 100dvh;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
      radial-gradient(1px 1px at 80% 60%, #fff6, transparent),
      radial-gradient(1px 1px at 50% 80%, #fff5, transparent),
      radial-gradient(1px 1px at 65% 15%, #fff7, transparent),
      radial-gradient(1px 1px at 35% 55%, #fff5, transparent);
  }
  .caption { position: fixed; top: 28px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.5); font-size: 15px; letter-spacing: 3px;
    text-transform: uppercase; font-weight: 300; }
  .hint { position: fixed; bottom: 24px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.32); font-size: 14px; font-style: italic; }

  /* ─── orbiting system ─────────────────────────────────────── */
  .system { position: fixed; top: 50%; left: 50%; width: 0; height: 0; }
  .track {
    position: absolute; left: 50%; top: 50%; border-radius: 50%;
    border: 1px solid rgba(var(--accent-rgb), 0.12);
    opacity: 0; transform: scale(0.4);
    transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
  }
  .ring {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    animation: spin var(--period) linear infinite;
  }
  .system:hover .ring, .system:focus-within .ring { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes unspin { to { transform: rotate(-360deg); } }

  /* ─── bloom state on .system.bloomed ───────────────────────── */
  .system.bloomed .track { opacity: 1; transform: scale(1); }

  .sun {
    position: absolute; left: 50%; top: 50%;
    width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #ffe9b8, #f0a338 60%, #c8761b);
    box-shadow: 0 0 22px rgba(240,163,56,0.5), 0 0 52px rgba(240,163,56,0.22);
    border: none; cursor: pointer; z-index: 4;
    animation: pulse 6s ease-in-out infinite;
    transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease);
  }
  @keyframes pulse { 50% { box-shadow: 0 0 30px rgba(240,163,56,0.7), 0 0 78px rgba(240,163,56,0.32); } }
  .sun.flash { box-shadow: 0 0 48px rgba(255,220,150,0.95), 0 0 130px rgba(240,163,56,0.55); transform: scale(1.18); }
  .sun.remote-focus { outline: 2px solid var(--accent); outline-offset: 6px; }

  .body {
    position: absolute; left: 0; top: 0;
    width: var(--chip); height: var(--chip); margin: calc(var(--chip)/-2);
    /* COLLAPSED default: tucked at the sun center, invisible */
    transform: rotate(var(--a)) translate(0) rotate(calc(-1 * var(--a))) scale(0);
    opacity: 0;
    transition: transform 0.7s var(--ease), opacity 0.5s ease;
    transition-delay: var(--delay, 0s);
  }
  /* BLOOMED: fly out to the orbital ring radius, full scale */
  .system.bloomed .body {
    transform: rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a))) scale(1);
    opacity: 1;
  }
  .body .ico {
    width: 100%; height: 100%; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: var(--glass); border: 1px solid var(--stroke); color: var(--ink);
    backdrop-filter: blur(12px) saturate(1.4); -webkit-backdrop-filter: blur(12px) saturate(1.4);
    /* counter-rotate so the glyph stays upright as the ring turns */
    animation: unspin var(--period) linear infinite;
    transition: background 0.25s, border-color 0.25s, box-shadow 0.4s, transform 0.25s var(--ease);
  }
  .system:hover .body .ico, .system:focus-within .body .ico { animation-play-state: paused; }
  .body .ico:hover { background: var(--glass-hi); border-color: rgba(var(--accent-rgb),0.55); transform: scale(1.12); }
  .body svg { width: 20px; height: 20px; }

  /* Apple-TV style accent focus ring */
  .body.remote-focus .ico {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.55), 0 0 22px rgba(var(--accent-rgb),0.5);
    transform: scale(1.16);
  }

  .body .lbl {
    position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
    color: rgba(255,255,255,0.5); white-space: nowrap; opacity: 0; transition: opacity 0.2s;
  }
  .body .ico:hover + .lbl, .body.remote-focus .lbl { opacity: 1; }

  /* sky control lit */
  .ico.lit { background: rgba(var(--accent-rgb),0.26); border-color: rgba(var(--accent-rgb),0.75);
    box-shadow: 0 0 14px rgba(var(--accent-rgb),0.55), 0 0 32px rgba(var(--accent-rgb),0.3); }
  .ico.lit svg { color: var(--accent); filter: drop-shadow(0 0 4px rgba(var(--accent-rgb),0.9)); }
  .sky-lines { stroke-dasharray: 60; stroke-dashoffset: 60; transition: stroke-dashoffset 0.7s var(--ease); }
  .ico.lit .sky-lines { stroke-dashoffset: 0; }

  .shimmer { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 1;
    background: linear-gradient(115deg, transparent 35%, rgba(var(--accent-rgb),0.16) 50%, transparent 65%);
    background-size: 250% 100%; }
  .shimmer.run { animation: sweep 1.1s var(--ease) forwards; }
  @keyframes sweep { 0% { opacity:0; background-position:120% 0; } 25% { opacity:1; } 100% { opacity:0; background-position:-40% 0; } }

  @media (prefers-reduced-motion: reduce) {
    .ring, .body .ico, .sun { animation: none !important; }
    .body, .track, .sun { transition: none !important; }
    .sky-lines { transition: none; }
    .shimmer.run { animation: none; }
  }
</style>
</head>
<body>
  <div class="caption">Orbiting bodies</div>
  <div class="shimmer" id="shimmer"></div>

  <div class="system" id="system">
    <div class="track" id="trackInner"></div>
    <div class="track" id="trackOuter"></div>
    <button class="sun" id="sun" aria-label="Bloom or collapse the controls" aria-expanded="false"></button>
    <div class="ring" id="ringInner" style="--period: var(--spin);"></div>
    <div class="ring" id="ringOuter" style="--period: 78s;"></div>
  </div>

  <div class="hint">Tap the sun to bloom · remote: arrows move, select activates</div>

<script>
  const ICONS = {
    tour: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>',
    dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor" stroke="none"/></svg>',
    sky: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline class="sky-lines" points="4,15 9,7 14,13 20,5"/><circle cx="4" cy="15" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="7" r="1.4" fill="currentColor" stroke="none"/><circle cx="14" cy="13" r="1.4" fill="currentColor" stroke="none"/><circle cx="20" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg>',
    zin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>',
    zout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="12" x2="18" y2="12"/></svg>',
    info: '<span style="font-size:18px;font-style:italic;">i</span>',
    help: '<span style="font-size:18px;">?</span>',
  };
  const INNER = [ ['tour','Tour'], ['dice','Dice'], ['sky','Sky'], ['info','About'] ];
  const OUTER = [ ['zin','Zoom in'], ['zout','Zoom out'], ['help','Keys'] ];
  const R_INNER = 78, R_OUTER = 130;

  function fillRing(ringEl, items, radius) {
    const n = items.length;
    items.forEach(([k, label], i) => {
      const a = (360 / n) * i;
      const body = document.createElement('div');
      body.className = 'body';
      body.style.setProperty('--a', a + 'deg');
      body.style.setProperty('--r', radius + 'px');
      const ico = document.createElement('button');
      ico.className = 'ico'; ico.dataset.k = k; ico.setAttribute('aria-label', label); ico.tabIndex = -1;
      ico.style.animationDuration = ringEl.style.getPropertyValue('--period');
      ico.innerHTML = ICONS[k];
      const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = label;
      body.appendChild(ico); body.appendChild(lbl);
      ringEl.appendChild(body);
    });
  }
  function track(el, r) { el.style.width = el.style.height = (r*2)+'px'; el.style.margin = (-r)+'px 0 0 '+(-r)+'px'; }
  track(document.getElementById('trackInner'), R_INNER);
  track(document.getElementById('trackOuter'), R_OUTER);

  const ringInner = document.getElementById('ringInner');
  const ringOuter = document.getElementById('ringOuter');
  fillRing(ringInner, INNER, R_INNER);
  fillRing(ringOuter, OUTER, R_OUTER);

  const system = document.getElementById('system');
  const sun = document.getElementById('sun');
  const shimmer = document.getElementById('shimmer');
  // ring index 0 = inner, 1 = outer; each .body in document order
  const ringBodies = [
    Array.from(ringInner.querySelectorAll('.body')),
    Array.from(ringOuter.querySelectorAll('.body')),
  ];

  let bloomed = false;
  let focusRing = 0, focusIdx = -1; // -1 = sun focused

  function setDelays(forward) {
    // staggered cascade; reversed on collapse
    ringBodies.forEach((bodies) => {
      const n = bodies.length;
      bodies.forEach((b, i) => {
        const step = forward ? i : (n - 1 - i);
        b.style.setProperty('--delay', (step * 0.06) + 's');
      });
    });
  }

  function flashSun() {
    sun.classList.remove('flash'); void sun.offsetWidth; sun.classList.add('flash');
    setTimeout(() => sun.classList.remove('flash'), 520);
  }

  function clearFocusRing() {
    document.querySelectorAll('.body.remote-focus').forEach(b => b.classList.remove('remote-focus'));
    sun.classList.remove('remote-focus');
  }
  function paintFocus() {
    clearFocusRing();
    if (focusIdx < 0) { sun.classList.add('remote-focus'); return; }
    const b = ringBodies[focusRing][focusIdx];
    if (b) b.classList.add('remote-focus');
  }

  function bloom() {
    bloomed = true; setDelays(true);
    system.classList.add('bloomed');
    sun.setAttribute('aria-expanded', 'true');
    flashSun();
    focusRing = 0; focusIdx = 0; paintFocus();
  }
  function collapse() {
    bloomed = false; setDelays(false);
    system.classList.remove('bloomed');
    sun.setAttribute('aria-expanded', 'false');
    flashSun();
    clearFocusRing();
    focusIdx = -1;
  }
  function toggleBloom() { bloomed ? collapse() : bloom(); }

  function activate(body) {
    const ico = body.querySelector('.ico');
    if (!ico) return;
    if (ico.dataset.k === 'sky') {
      if (ico.classList.toggle('lit')) {
        shimmer.classList.remove('run'); void shimmer.offsetWidth; shimmer.classList.add('run');
      }
    } else {
      // generic affordance: brief shimmer pulse
      shimmer.classList.remove('run'); void shimmer.offsetWidth; shimmer.classList.add('run');
    }
  }

  sun.addEventListener('click', toggleBloom);

  document.addEventListener('click', (e) => {
    const ico = e.target.closest('.ico');
    if (!ico || ico === sun) return;
    activate(ico.closest('.body'));
  });

  // ─── Apple TV / Siri Remote simulation ───────────────────────
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'Escape') { if (bloomed) { collapse(); e.preventDefault(); } return; }
    if (!bloomed) {
      if (k === 'Enter' || k === ' ') { bloom(); e.preventDefault(); }
      return;
    }
    const len = () => ringBodies[focusRing].length;
    if (k === 'ArrowRight') { focusIdx = focusIdx < 0 ? 0 : (focusIdx + 1) % len(); paintFocus(); e.preventDefault(); }
    else if (k === 'ArrowLeft') { focusIdx = focusIdx < 0 ? 0 : (focusIdx - 1 + len()) % len(); paintFocus(); e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 'ArrowUp') {
      focusRing = focusRing === 0 ? 1 : 0;
      if (focusIdx < 0) focusIdx = 0;
      focusIdx = Math.min(focusIdx, ringBodies[focusRing].length - 1);
      paintFocus(); e.preventDefault();
    }
    else if (k === 'Enter' || k === ' ') {
      if (focusIdx < 0) { collapse(); } else { activate(ringBodies[focusRing][focusIdx]); }
      e.preventDefault();
    }
  });
</script>
</body>
</html>
